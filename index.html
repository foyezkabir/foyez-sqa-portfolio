
  <!DOCTYPE html>
  <!-- `dark` belongs on html, not on a div inside body. With it further down the
       tree, body itself resolved the light theme and painted white, which showed
       through on scroll repaints and on rubber-band overscroll. -->
  <html lang="en" class="dark">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Foyez Ullah Kabir | SQA Engineer</title>
      <meta name="description" content="Portfolio of Foyez Ullah Kabir, SQA Engineer with 3+ years of experience in test automation, API testing, and quality engineering." />
      <meta name="robots" content="noindex, nofollow" />
      <!-- Declared explicitly, which is what stops the browser requesting
           /favicon.ico on its own. That 404 was the only console error on the
           page.

           The FK monogram, white on #0a0a0a, which is the dark theme's
           --background, so the tile is the same black the page itself paints.
           Supplied as artwork rather than geometry, so this is a PNG set instead
           of the single SVG that was here before: 32 for the tab, 192 for PWA
           and Android, 512 as the high-density source.

           The source art sat off-centre in its frame, right of centre and
           filling half the width, so it is cropped to the glyph and re-padded
           symmetrically. Straight from the file it rendered small and lopsided
           at 16px.

           apple-touch-icon is deliberately square and opaque. iOS applies its
           own corner mask, so shipping one already rounded double-rounds it and
           shipping one with transparency puts black behind the gaps. -->
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
      <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
